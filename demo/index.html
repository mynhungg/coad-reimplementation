<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoAD Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=69">
<script src="vendor/plotly-2.35.2.min.js"></script>
</head>
<body>
<header>
  <button class="link" id="toggleSidebar" title="Ẩn/hiện cấu hình">☰</button>
  <span class="brand">CoAD Lab</span>
  <nav>
    <button data-screen="data">Dữ liệu</button>
    <button data-screen="series" class="active">Phân tích chuỗi</button>
    <button data-screen="errors">Phân tích lỗi</button>
    <button data-screen="results">Kết quả thực nghiệm</button>
  </nav>
  <span class="spacer"></span>
  <button class="link" id="toggleExplain" title="Bật/tắt các câu giải thích cho người mới">Giải thích: Bật</button>
  <button class="link" id="openTour">Hướng dẫn</button>
  <button class="link" id="langBtn" title="VI / EN">English</button>
  <button class="link" id="openAbout">Phạm vi &amp; tái lập</button>
</header>

<div class="toolbar" id="toolbar"></div>

<div class="workspace" id="workspace">
  <aside id="sidebar">
    <section class="sb">
      <div class="sbh"><span class="num">1</span>Chọn chuỗi dữ liệu</div>
      <div id="cfgSeries" class="serieslist"></div>
    </section>

    <section class="sb">
      <div class="sbh"><span class="num">2</span>Phương pháp</div>
      <div id="cfgMethods"></div>
      <details class="adv"><summary>Thông số mô hình (chỉ đọc)</summary><dl class="kv" id="advanced"></dl></details>
    </section>



  </aside>

  <main>
    <section id="screen-data" class="hidden"></section>
    <section id="screen-series"></section>
    <section id="screen-errors" class="hidden"></section>
    <section id="screen-results" class="hidden"></section>
  </main>
</div>

<div class="modal" id="about"><div class="box" id="aboutBox"></div></div>

<script src="i18n.js?v=24"></script>
<script src="rules.js?v=38"></script>
<script src="illus.js?v=65"></script>
<script src="experiments.js?v=3"></script>
  <script src="app.js?v=74"></script>
</body>
</html>
